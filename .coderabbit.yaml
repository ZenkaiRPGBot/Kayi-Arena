language: en-US
reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!*.sqlite3"
    - "!*.db"
    - "!.env"
    - "!.env.*"
    - "!data/*snapshot*.json"
    - "!**/__pycache__/**"
chat:
  auto_reply: true
