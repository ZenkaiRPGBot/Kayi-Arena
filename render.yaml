services:
  - type: web
    name: kayi-arena
    runtime: python
    plan: free
    region: frankfurt
    autoDeploy: true
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: python -u -m app.main
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONPATH
        value: "."
      - key: PORT
        value: "10000"
      - key: TRANSPORT_MODE
        value: webhook
      - key: DROP_PENDING_UPDATES
        value: "false"
      - key: WEBHOOK_PATH
        value: /telegram/webhook
      - key: WEBHOOK_SECRET
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        value: KayiArenaBot
      - key: OWNER_ID
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: LOG_CHANNEL_ID
        sync: false
      - key: MEDIA_CHANNEL_ID
        sync: false
      - key: WELCOME_VIDEO_FILE_ID
        sync: false
      - key: DEVELOPER_URL
        value: https://t.me/qouba
      - key: UPDATES_URL
        value: https://t.me/KayiBots
      - key: SUPPORT_URL
        value: https://t.me/KayiBots
      # Note: Render Free Web Services use an ephemeral filesystem.
      # For durable production persistence across redeploys, attach a paid
      # persistent disk (e.g. /var/data) or migrate SqliteMatchStore to external Postgres.
      - key: ARENA_DB_PATH
        value: data/kayi_arena.sqlite3
      - key: ARENA_STATE_DB_PATH
        value: data/kayi_arena_state.sqlite3
      - key: RESTART_STATE_PATH
        value: ""
      - key: ARENA_DATASET_KIND
        value: production
      - key: LOG_LEVEL
        value: INFO
